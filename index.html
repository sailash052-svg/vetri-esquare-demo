  app.querySelectorAll('.ud').forEach(function(b){b.onclick=function(){var u=upcoming().slice();u.splice(+b.getAttribute('data-k'),1);CFG.upcoming=u;saveCfg();again();};});
  if($('ua'))$('ua').onclick=function(){var t=$('ut').value.trim(),d=$('ud').value.trim(),box=$('am2');if(!t){box.style.display='block';box.style.background='#FDE3EA';box.style.border='1px solid #FF5A4E';box.textContent='Enter the movie name.';return;}var u=upcoming().slice();u.push({t:t,d:d||'Date to be announced'});CFG.upcoming=u;saveCfg();again();};

  app.querySelectorAll('.sv').forEach(function(e){e.onchange=function(){var k=e.getAttribute('data-h'),o=hallShow(k);o.secs=+e.value;setHall(k,o);amsg('Saved.',1);};});

  if($('sdef'))$('sdef').onclick=function(){delete CFG.screens;saveCfg();again();};

    if(m.auto){CFG.auto[m.t].s=ns;}else if(m.custom){(CFG.added||[]).forEach(function(a){if(a.t===m.t)a.s=ns;});}else{CFG.scr=CFG.scr||{};CFG.scr[m.t]=ns;}

  app.querySelectorAll('.md').forEach(function(e){e.onclick=function(){

  app.querySelectorAll('.mr').forEach(function(e){e.onclick=function(){var t=e.getAttribute('data-t');CFG.removed=(CFG.removed||[]).filter(function(x){return x!==t;});saveCfg();applyCfg();again();};});
  function soonFill(x){
    if(!x)return;var f=SOON_INFO[x.t]||{};
    $('nt').value=x.t;
    if(x.d&&/\d/.test(x.d))$('nrel').value=x.d;
    if(f.dir)$('nd').value=f.dir;
    if(f.run)$('nr').value=f.run;
    if(f.cert&&CERTS.indexOf(f.cert)>=0)$('nc').value=f.cert;
    var bits=[];if(f.hero)bits.push(f.hero);if(f.heroine)bits.push(f.heroine);if(f.more)bits.push(f.more);
    if(bits.length)$('nm').value=bits.join('. ').slice(0,120);
  }
  app.querySelectorAll('.sg').forEach(function(e){e.onclick=function(){soonFill(upcoming()[+e.getAttribute('data-k')]);};});
  if($('nt'))$('nt').onchange=function(){var v=$('nt').value.trim().toLowerCase();soonFill(upcoming().filter(function(x){return x.t.toLowerCase()===v;})[0]);};
  if($('na'))$('na').onclick=function(){
    var t=cleanTitle($('nt').value),run=$('nr').value.trim(),scr=$('ns').value,times=[];
    app.querySelectorAll('.nts').forEach(function(c){if(c.checked)times.push(+c.getAttribute('data-i'));});
    if(!t){amsg('Enter the movie name.');return;}
    if(MOVIES.some(function(m){return m.t.toLowerCase()===t.toLowerCase();})||(CFG.removed||[]).some(function(x){return x.toLowerCase()===t.toLowerCase();})){amsg('A movie with this name already exists (or is in Deleted movies). Use another name or restore it.');return;}
    if(!run){amsg('Enter the runtime, for example 2h 30m.');return;}
    if(!times.length){amsg('Tick at least one show time.');return;}
    var relk=relKey($('nrel').value),from=($('nfr').checked&&relk)?relk:'',clash=clashFor(scr,times,from,'',null);
    if(clash){amsg('Clash: '+scr+' already shows '+clash.o.t+' at '+TIMES[clash.t]+'. Pick other times or another screen.');return;}
    var cert=$('nc').value,a={t:t,m:$('nl').value+' \u00b7 '+run+' \u00b7 '+cert,s:scr,times:times.sort(),info:{},poster:'',from:from};
    var soon=upcoming().filter(function(x){return x.t.toLowerCase()===t.toLowerCase();})[0],sf=soon?(SOON_INFO[soon.t]||{}):{};
    for(var k2 in sf)a.info[k2]=sf[k2];
    var fv={rel:$('nrel').value.trim(),run:run,cert:cert,dir:$('nd').value.trim(),more:$('nm').value.trim()};
    for(var k3 in fv)if(fv[k3])a.info[k3]=fv[k3];
    if(soon&&!a.info.rel&&soon.d&&/\d/.test(soon.d))a.info.rel=soon.d;
    function commit(){
      var old=CFG.added,oldUp=CFG.upcoming;CFG.added=(CFG.added||[]).concat([a]);
      if(soon&&$('nrm').checked)CFG.upcoming=upcoming().filter(function(x){return x!==soon;});

      applyCfg();again();

    var f=$('np').files[0];
    if(!f){commit();return;}
    if(!/^image\//.test(f.type)){amsg('Choose a picture file for the poster.');return;}
    var fr=new FileReader();

      a.poster=cv.toDataURL('image/jpeg',0.85);commit();};
      im.onerror=function(){amsg('That file could not be read as a picture.');};im.src=fr.result;};

  window.scrollTo(0,0);
  ({home:home,movies:moviesPage,movie:function(){movieDetail(+p[1],p[2]);},t:function(){ticketView(p[1]);},soon:function(){soonDetail(+p[1]);},book:seats,view:function(){view(p[1],p[2]);},pay:pay,ticket:ticket,failed:failed,admin:function(){if(staffIn())admin();else adminLogin();}}[r]||home)();
}
try{history.scrollRestoration='manual';}catch(e){}
window.addEventListener('hashchange',route);route();
})();
