}

  }else if(adminView==='movies'){
    body='<h1>Movies</h1><div class="tb"><div class="r h"><div>Movie</div><div>Screen</div><div>Status</div><div>Shows per day</div><div></div></div>'+MOVIES.map(function(m,j){var on=m.times.length>0;return '<div class="r"><div style="font-weight:700">'+m.t+'<div style="font-weight:400;font-size:12px;color:#717171">'+m.m+'</div></div><div>'+m.s+'</div><div>'+(on?'Showing':'Not showing')+'</div><div>'+m.times.length+'</div><div><button class="mt" data-j="'+j+'" style="min-height:34px;padding:0 12px;border:1px solid #222;background:#fff;border-radius:6px">'+(on?'Stop showing':'Start showing')+'</button></div></div>';}).join('')+'</div><p style="color:#717171;font-size:13px;margin-top:10px">A movie that is not showing is hidden from the website and cannot be booked.</p>';
  }else if(adminView==='upcoming'){
    var up=upcoming();
    body='<h1>Coming soon</h1><p style="color:#717171;font-size:14px;margin:0 0 14px">These movies appear in the Coming soon section of the website. They cannot be booked yet.</p><div class="tb"><div class="r h"><div>Movie</div><div>Release</div><div></div></div>'+(up.map(function(x,k){return '<div class="r"><div style="font-weight:700">'+esc(x.t)+'</div><div>'+esc(x.d)+'</div><div><button class="ud" data-k="'+k+'" style="min-height:34px;padding:0 12px;border:1px solid #222;background:#fff;border-radius:6px">Remove</button></div></div>';}).join('')||'<div class="r" style="min-width:0;color:#717171">Nothing listed.</div>')+'</div>'+H2+'Add a movie</h2><div class="form"><div class="fl"><div style="flex:1 1 220px"><label>Movie name</label><input id="ut"></div><div style="flex:1 1 180px"><label>Release (for example 27 Nov 2026)</label><input id="ud"></div></div><button id="ua">Add</button><div class="msg" id="am2"></div><div style="font-size:13px;color:#717171;margin-top:12px">To show a poster, add a picture named like the movie (for example <b>maaruvesham.jpg</b>) to the posters folder.</div></div>';
  }else if(adminView==='bookings'){
    body='<h1>Bookings</h1><p style="color:#717171;font-size:14px;margin:0 0 14px">Every ticket paid for on the website. Cancelling a booking frees its seats.</p>'+bookingRows()+'<button type="button" id="cl" style="margin-top:16px;min-height:40px;padding:0 16px;border:1px solid #D0362B;color:#D0362B;background:#fff;border-radius:6px">Clear all demo bookings and snack orders</button>';
  }else if(adminView==='snacks'){
    body='<h1>Snack orders</h1><p style="color:#717171;font-size:14px;margin:0 0 14px">Orders placed on the website appear here with the screen and seat. Take the snacks to that seat, then press Delivered.</p>'+snackRows();
  }else if(adminView==='settings'){

  }else{

  }

  app.querySelectorAll('.nv').forEach(function(b){b.onclick=function(){if(b.id==='lo')return;admin(b.getAttribute('data-v'));window.scrollTo(0,0);};});
  $('lo').onclick=function(){staffSet(false);adminLogin();window.scrollTo(0,0);};
  app.querySelectorAll('.dl').forEach(function(b){b.onclick=function(){var o=orders();o.forEach(function(x){if(x.id===b.getAttribute('data-id'))x.done=true;});saveOrders(o);again();};});
  app.querySelectorAll('.bc').forEach(function(b){b.onclick=function(){var o=bookings();o.forEach(function(x){if(x.id===b.getAttribute('data-id'))x.cancelled=true;});saveBookings(o);again();};});
  app.querySelectorAll('.dsel').forEach(function(b){b.onclick=function(){adminDay=+b.getAttribute('data-d');again();};});
  app.querySelectorAll('.mt').forEach(function(b){b.onclick=function(){var m=MOVIES[+b.getAttribute('data-j')];CFG.slots=CFG.slots||{};m.times=m.times.length?[]:m.def.slice();CFG.slots[m.t]=m.times.slice();saveCfg();again();};});

function route(){
  var p=(location.hash||'#/').replace(/^#\/?/,'').split('/');
  var r=p[0]||'home';
  if(r==='book'){if(p[1]!==undefined&&p[1]!==''){st.movie=+p[1]||0;if(!MOVIES[st.movie])st.movie=0;st.date=Math.min(DAYS,Math.max(0,+p[3]||0));if(p[2]!==undefined&&p[2]!==''){st.t=+p[2];}if(MOVIES[st.movie].times.indexOf(st.t)<0||isPast(st.date,st.t))st.t=firstOpen(MOVIES[st.movie],st.date);st.sel=[];}}
  if(r==='now'||r==='screens'||r==='visit'){if(!$('s-now')||document.querySelector('.hero')===null)home();var id={now:'s-now',screens:'s-screens',visit:'s-visit'}[r];var el=$(id);if(el)el.scrollIntoView();try{history.replaceState(null,'',location.pathname+location.search+'#/');}catch(e){}return;}
  window.scrollTo(0,0);
  ({home:home,movie:function(){movieDetail(+p[1],p[2]);},t:function(){ticketView(p[1]);},soon:function(){soonDetail(+p[1]);},book:seats,view:function(){view(p[1],p[2]);},pay:pay,ticket:ticket,failed:failed,admin:function(){if(staffIn())admin();else adminLogin();}}[r]||home)();
}
try{history.scrollRestoration='manual';}catch(e){}
window.addEventListener('hashchange',route);route();
})();
