<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vetri E-Square 3D seat view</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Hanken+Grotesk:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0C0810;color:#F4EDE0;font-family:'Hanken Grotesk',system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100vh;height:100dvh}
.demo{background:#FFC21A;color:#0C0810;text-align:center;padding:4px 10px;font-size:12px;font-weight:700}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 12px;flex-wrap:wrap}
.brand{font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:22px;white-space:nowrap}
.brand span{color:#E53935}
.seg{display:inline-flex;background:rgba(30,22,36,.92);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:#cfc6d8;border-radius:999px;min-height:40px;padding:0 16px;font-size:14px}
.seg button.on{background:#F4EDE0;color:#15101a}
#stage{position:relative;flex:1;min-height:0;background:#000;touch-action:none;cursor:grab;overflow:hidden;user-select:none;-webkit-user-select:none}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;z-index:2}
.tl{left:10px;top:10px}
.tr{right:10px;top:10px;display:flex;gap:8px;align-items:center}
.badge{background:#E53935;color:#fff;font-weight:700;padding:0 14px;border-radius:999px;min-height:40px;display:inline-flex;align-items:center;font-size:15px}
.round{min-width:40px;width:40px;padding:0;border-radius:50%;font-style:italic;font-family:Georgia,serif;font-size:18px}
#hint{top:58px;left:0;right:0;text-align:center;font-size:13px;color:#e8dfee;pointer-events:none;transition:opacity .6s}
#hint span{background:rgba(12,8,16,.72);padding:6px 12px;border-radius:999px}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:#A99FB5}
#notebox{display:none;left:10px;right:10px;top:58px;background:rgba(21,16,26,.96);border-left:4px solid #FFC21A;padding:12px 14px;font-size:13px;line-height:1.55;color:#d6cce0;border-radius:6px;max-height:55%;overflow:auto}
#notebox.open{display:block}
button{font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
.round,.pill,.pad button{border:0;background:rgba(30,22,36,.88);color:#F4EDE0;min-height:48px;min-width:48px;border-radius:12px}
.pill{left:10px;bottom:12px;border-radius:999px;padding:0 18px}
.pad{right:10px;bottom:12px;display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,52px);gap:6px}
.pad button{font-size:20px;padding:0;min-width:0;width:52px;height:52px}
.pad button:active,.pill:active{background:#E53935}
#fwd{grid-column:2;grid-row:1}#lft{grid-column:1;grid-row:2}#bck{grid-column:2;grid-row:2}#rgt{grid-column:3;grid-row:2}
#stage[data-mode="hall"] .pad,#stage[data-mode="hall"] .pill{display:none}
.legend{display:none;left:10px;bottom:12px;gap:12px;font-size:12px;color:#e8dfee;background:rgba(12,8,16,.72);padding:6px 10px;border-radius:999px}
#stage[data-mode="hall"] .legend{display:flex}
.legend i{display:inline-block;width:11px;height:11px;margin-right:4px;border-radius:2px;vertical-align:-1px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#15101a;border-top:1px solid #2a2032}
#info{font-size:14px;color:#b9aec6;line-height:1.35}
#info b{color:#F4EDE0;font-size:17px}
.cta{background:#E53935;color:#fff;border:0;border-radius:999px;min-height:48px;padding:0 22px;font-size:16px;white-space:nowrap}
.cta:active{background:#b72b28}
#fsBtn{font-style:normal;display:inline-flex;align-items:center;justify-content:center}#fsBtn svg{width:22px;height:22px;stroke:#F4EDE0;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:480px){.brand{font-size:19px}.seg button{padding:0 12px}}
</style>
</head>
<body>
<div class="demo">Demo preview. Payment is simulated.</div>
<div class="top">
<div class="brand">VETRI <span>E-SQUARE</span></div>
<div class="seg" role="group" aria-label="Choose screen">
<button id="t1" class="on">EPIQ 1</button>
<button id="t2">EPIQ 2</button>
<button id="t3">COSMIQ</button>
</div>
</div>
<div id="stage" data-mode="seat">
<div class="ov tl seg" role="group" aria-label="View mode"><button id="m_seat" class="on">Seat</button><button id="m_hall">Hall</button></div>
<div class="ov tr"><span class="badge" id="badge">-</span><button class="round" id="infoBtn" aria-label="About this view">i</button><button class="round" id="fsBtn" aria-label="Full screen" title="Full screen"></button></div>
<div class="ov" id="notebox"></div>
<div class="ov" id="hint"><span id="hintT"></span></div>
<button class="ov pill" id="face">Face the screen</button>
<div class="ov legend"><span><i style="background:#e8e4dc"></i>Seat</span><span><i style="background:#f0b429"></i>Best view</span><span><i style="background:#e53935"></i>Yours</span></div>
<div class="ov pad" role="group" aria-label="Move to another seat">
<button id="fwd" aria-label="Seat in front">&#9650;</button>
<button id="lft" aria-label="Seat to the left">&#9664;</button>
<button id="bck" aria-label="Seat behind">&#9660;</button>
<button id="rgt" aria-label="Seat to the right">&#9654;</button>
</div>
<div id="err">3D view needs WebGL, which this browser has turned off.</div>
</div>
<div class="bar"><div id="info" aria-live="polite"></div><button class="cta" id="book">BOOK (DEMO)</button></div>
<script>
(function(){
function allx(n){return new Array(n+1).join('x');}
function dots(n){return new Array(n+1).join('.');}
function RW(lab,mask,o){var r={lab:lab,mask:mask};if(o)for(var k in o)r[k]=o[k];return r;}
// rows are listed front (nearest the screen) to back; each mask char is one seat slot ('x' seat, '.' none)
var epiqRows=[];'LKJIHGFEDCBA'.split('').forEach(function(l){epiqRows.push(RW(l,allx(26)));});
var cosRows=[];'RQPONM'.split('').forEach(function(l){cosRows.push(RW(l,allx(21)));});
cosRows.push(RW('L','..'+allx(19)));                       // row L: 19 seats, left block starts two places in
'KJIHGFEDC'.split('').forEach(function(l){cosRows.push(RW(l,allx(21)));});
cosRows.push(RW('B','xxx'+dots(18),{lift:0.35,partial:true})); // VIP box, back left
cosRows.push(RW('A','xx'+dots(19),{lift:0.35,partial:true}));
var EP={rows:epiqRows,blocks:[5,16,5],pitch:1.22,R0:13,cz:-3,seatW:0.62,aisle:1.1,rise:0.42,base:0.3,crossAfter:3,crossGap:1.5,crossStep:0.3,eye:1.1,screenBottom:1.2,hallW:26,side:11.3,swoosh:false,sign:null};
var HALLS={
  epiq1:Object.assign({name:'EPIQ 1',screen:{w:19.8,h:10.4}},EP),
  epiq2:Object.assign({name:'EPIQ 2',screen:{w:18.6,h:9.8}},EP),
  cosmiq:{name:'COSMIQ',screen:{w:14,h:6.2},rows:cosRows,blocks:[4,13,4],pitch:1.1,R0:20,cz:-12,seatW:0.62,aisle:0.9,rise:0.28,base:0.3,crossAfter:6,crossGap:1.5,crossStep:0.3,eye:1.1,screenBottom:1.2,hallW:19,side:8.8,swoosh:false,sign:null}
};
var NOTES={
  epiq1:'<b>EPIQ 1.</b> Seat layout from the theatre\'s booking seat map: rows L (front) to A (back), a walkway between J and I, three blocks split by two aisles. Look and finish are modelled from the theatre\'s own photos. Dimensions are estimates until the theatre shares its drawings.',
  epiq2:'<b>EPIQ 2.</b> Uses the EPIQ 1 layout for now. The real EPIQ 2 seat map has not been added yet, so the seating may differ. The screen is the smaller 61 &times; 32 ft one.',
  cosmiq:'<b>COSMIQ.</b> Seat layout from the theatre\'s booking seat map: six front rows (R to M), a walkway, then rows L to C (row L has 19 seats), and a small VIP box (rows B and A) at the back left. There are no COSMIQ photos yet, so the finish copies the EPIQ look, and the screen size, row spacing and floor rise are estimates.'
};

function roundedBox(w,h,d,r,seg){
  var g=new THREE.BoxGeometry(w,h,d,seg,seg,seg),pa=g.attributes.position,na=g.attributes.normal;
  var hx=w/2-r,hy=h/2-r,hz=d/2-r,v=new THREE.Vector3(),c=new THREE.Vector3(),dv=new THREE.Vector3();
  for(var i=0;i<pa.count;i++){
    v.fromBufferAttribute(pa,i);
    c.set(Math.max(-hx,Math.min(hx,v.x)),Math.max(-hy,Math.min(hy,v.y)),Math.max(-hz,Math.min(hz,v.z)));
    dv.copy(v).sub(c);var l=dv.length();
    if(l>1e-6){dv.multiplyScalar(1/l);v.copy(c).addScaledVector(dv,r);na.setXYZ(i,dv.x,dv.y,dv.z);}
    pa.setXYZ(i,v.x,v.y,v.z);
  }
  return g;
}
function tint(g,hex){
  var n=g.attributes.position.count,a=new Float32Array(n*3),k=new THREE.Color(hex);
  for(var i=0;i<n;i++){a[i*3]=k.r;a[i*3+1]=k.g;a[i*3+2]=k.b;}
  g.setAttribute('color',new THREE.BufferAttribute(a,3));return g;
}
function mk(w,h,d,r,x,y,z,rx,hex){var g=roundedBox(w,h,d,r,6);g.rotateX(rx);g.translate(x,y,z);return tint(g,hex);}
function mergeGeos(list){
  var pos=[],nor=[],colr=[],idx=[],off=0;
  list.forEach(function(g){
    var pa=g.attributes.position,na=g.attributes.normal,ca=g.attributes.color,ix=g.index,i;
    for(i=0;i<pa.count;i++){pos.push(pa.getX(i),pa.getY(i),pa.getZ(i));nor.push(na.getX(i),na.getY(i),na.getZ(i));colr.push(ca.getX(i),ca.getY(i),ca.getZ(i));}
    if(ix){for(i=0;i<ix.count;i++)idx.push(ix.getX(i)+off);}
    off+=pa.count;
  });
  var m=new THREE.BufferGeometry();
  m.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  m.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  m.setAttribute('color',new THREE.Float32BufferAttribute(colr,3));
  m.setIndex(idx);return m;
}
function buildSeatGeometry(){
  var L=0x1d1d22,D=0x111114,PD=0x26262c,A=0x9a8350,parts=[];
  parts.push(mk(0.54,0.30,0.66,0.06,0,0.15,0.0,0,D));            // pedestal shell
  parts.push(mk(0.44,0.15,0.54,0.06,0,0.40,-0.05,-0.05,L));      // seat cushion
  parts.push(mk(0.46,0.60,0.17,0.07,0,0.70,0.28,0.22,L));        // backrest, leaning back
  parts.push(mk(0.28,0.17,0.12,0.05,0,1.04,0.36,0.25,L));        // headrest
  parts.push(mk(0.08,0.20,0.60,0.03,-0.28,0.52,-0.02,0,D));      // left arm
  parts.push(mk(0.08,0.20,0.60,0.03,0.28,0.52,-0.02,0,D));       // right arm
  parts.push(mk(0.075,0.04,0.50,0.02,-0.28,0.64,-0.04,0,PD));    // left arm pad
  parts.push(mk(0.075,0.04,0.50,0.02,0.28,0.64,-0.04,0,PD));     // right arm pad
  parts.push(mk(0.40,0.18,0.13,0.05,0,0.20,-0.38,-0.15,D));      // stowed footrest
  var cup=new THREE.CylinderGeometry(0.042,0.042,0.02,14);cup.translate(0.28,0.665,-0.2);parts.push(tint(cup,A)); // cup-holder ring
  return mergeGeos(parts);
}

var TH={bg:0x050407,hemi:0x8a7a78,key:0xffe0c0,fill:0xffb070,lamp:0xffe6c0,step:0xffb070,wash:0xff9a50};
var stage=document.getElementById('stage'),renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true});}catch(e){document.getElementById('err').style.display='flex';return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
stage.insertBefore(renderer.domElement,stage.firstChild);
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x050407);
scene.fog=new THREE.Fog(0x050407,26,70);
var camera=new THREE.PerspectiveCamera(74,1,0.1,110);
camera.rotation.order='YXZ';

// ---- shared textures ----
function carpetTex(){
  var c=document.createElement('canvas');c.width=c.height=256;var x=c.getContext('2d');
  x.fillStyle='#2a2030';x.fillRect(0,0,256,256);
  for(var j=0;j<16;j++){for(var k=0;k<16;k++){
    x.fillStyle=((j+k)%2)?'#33263a':'#221a28';
    x.beginPath();x.moveTo(k*16,j*16+16);x.lineTo(k*16+8,j*16);x.lineTo(k*16+16,j*16+16);x.lineTo(k*16+8,j*16+9);x.closePath();x.fill();}}
  var img=x.getImageData(0,0,256,256),d=img.data;
  for(var i=0;i<d.length;i+=4){var n=(Math.random()-0.5)*14;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}
  x.putImageData(img,0,0);
  var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t;
}
function fabricTex(){
  var c=document.createElement('canvas');c.width=c.height=128;var x=c.getContext('2d');
  x.fillStyle='#5a3826';x.fillRect(0,0,128,128);
  var img=x.getImageData(0,0,128,128),d=img.data;
  for(var i=0;i<d.length;i+=4){var n=(Math.random()-0.5)*22;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}
  x.putImageData(img,0,0);
  var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
function ceilTexF(){
  var c=document.createElement('canvas');c.width=c.height=256;var x=c.getContext('2d');
  x.fillStyle='#0f0e12';x.fillRect(0,0,256,256);x.strokeStyle='#1a1920';x.lineWidth=3;x.strokeRect(0,0,256,256);
  var img=x.getImageData(0,0,256,256),d=img.data;
  for(var i=0;i<d.length;i+=4){var n=(Math.random()-0.5)*10;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}
  x.putImageData(img,0,0);
  var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
function swooshTex(){
  var c=document.createElement('canvas');c.width=1024;c.height=768;var x=c.getContext('2d');
  x.lineCap='round';x.strokeStyle='rgba(225,225,230,0.55)';x.lineWidth=70;
  x.beginPath();x.moveTo(40,60);x.bezierCurveTo(420,120,600,600,980,700);x.stroke();
  x.beginPath();x.moveTo(40,700);x.bezierCurveTo(420,640,600,160,980,70);x.stroke();
  return new THREE.CanvasTexture(c);
}
function signTexF(txt){
  var c=document.createElement('canvas');c.width=640;c.height=240;var x=c.getContext('2d');
  x.shadowColor='rgba(255,226,170,0.95)';x.shadowBlur=28;x.fillStyle='#fff6e0';
  x.font='900 150px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(txt,320,125);
  return new THREE.CanvasTexture(c);
}
var FILM=[['The Dark Knight','dark-knight'],['John Wick','john-wick'],['Pirates of the Caribbean','jack-sparrow'],['Interstellar','interstellar'],['Rajinikanth','rajinikanth']],filmImgs=[],filmCur=0,filmPrev=-1,filmFade=1,filmLast=0,filmCtx=null,filmTexRef=null;
function filmDraw(i,a){
  var g=filmCtx,W=1024,H=540,im=filmImgs[i];g.globalAlpha=a;
  if(!im||!im.complete||!im.naturalWidth){g.fillStyle='#14141a';g.fillRect(0,0,W,H);g.globalAlpha=1;return;}
  // soft blurred backdrop (small canvas scaled up, works in every browser)
  var sm=document.createElement('canvas');sm.width=32;sm.height=17;var sg=sm.getContext('2d');
  var cr=Math.max(32/im.naturalWidth,17/im.naturalHeight);sg.drawImage(im,(32-im.naturalWidth*cr)/2,(17-im.naturalHeight*cr)/2,im.naturalWidth*cr,im.naturalHeight*cr);
  g.imageSmoothingEnabled=true;g.drawImage(sm,0,0,W,H);g.fillStyle='rgba(0,0,0,0.45)';g.fillRect(0,0,W,H);
  var ph=H-60,pw=ph*im.naturalWidth/im.naturalHeight,px=W/2-pw-30;
  g.shadowColor='rgba(0,0,0,0.7)';g.shadowBlur=30;g.drawImage(im,px,30,pw,ph);g.shadowBlur=0;
  g.fillStyle='#fff';g.textAlign='left';g.textBaseline='middle';
  g.font='900 54px sans-serif';g.fillText(FILM[i][0].toUpperCase(),W/2+10,H/2,W/2-40);
  g.globalAlpha=1;
}
function filmTick(now){
  if(!filmCtx)return;
  if(!filmLast)filmLast=now;
  if(filmFade>=1&&now-filmLast>4000){filmPrev=filmCur;filmCur=(filmCur+1)%FILM.length;filmFade=0;filmLast=now;}
  if(filmFade<1){filmFade=Math.min(1,filmFade+0.025);filmDraw(filmCur,1);if(filmPrev>=0&&filmFade<1)filmDraw(filmPrev,1-filmFade);filmTexRef.needsUpdate=true;}
}
function filmTex(){
  var c=document.createElement('canvas');c.width=1024;c.height=540;filmCtx=c.getContext('2d');
  filmCtx.fillStyle='#14141a';filmCtx.fillRect(0,0,1024,540);
  var t=new THREE.CanvasTexture(c);t.anisotropy=4;filmTexRef=t;var n=0;
  FILM.forEach(function(f,k){var im=new Image();im.onload=function(){n++;if(k===0||n===FILM.length){filmDraw(filmCur,1);t.needsUpdate=true;}};im.src='../film/'+f[1]+'-v1.jpg';filmImgs[k]=im;});
  return t;
}
function blankTex(){
  var c=document.createElement('canvas');c.width=512;c.height=270;var g=c.getContext('2d');
  var gr=g.createRadialGradient(256,135,20,256,135,330);gr.addColorStop(0,'#e4e1da');gr.addColorStop(1,'#a9a6a0');
  g.fillStyle=gr;g.fillRect(0,0,512,270);return new THREE.CanvasTexture(c);
}
function glowTexF(){var c=document.createElement('canvas');c.width=c.height=64;var x=c.getContext('2d');var g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.35,'rgba(255,255,255,0.35)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);}
function fadeTexF(){var c=document.createElement('canvas');c.width=4;c.height=128;var x=c.getContext('2d');var g=x.createLinearGradient(0,128,0,0);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,4,128);return new THREE.CanvasTexture(c);}
var carpet=carpetTex(),tFilm=filmTex(),tBlank=blankTex(),gTex=glowTexF(),fTex=fadeTexF(),swTex=swooshTex();
var seatGeo=buildSeatGeometry();seatGeo.userData.shared=true;
var seatMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.85,metalness:0});seatMat.userData.shared=true;
var seatMatHall=new THREE.MeshStandardMaterial({roughness:0.6,metalness:0});seatMatHall.userData.shared=true;

// ---- current hall state ----
var HC=null,G=null,seats=[],byRow=[],aisleArc=[],ROWS=0,backZ=0,seatMesh=null,pickMeshes=[],screenMat=null,screen=null,frame=null,glow=null;
var cur=-1,showFilm=true,curKey='epiq1';
var pm=new THREE.Matrix4(),pq=new THREE.Quaternion(),pe=new THREE.Euler(),pp=new THREE.Vector3(),ps=new THREE.Vector3(),one=new THREE.Vector3(1,1,1);
function Rof(r){return HC.R0+r*HC.pitch+(r>=HC.crossAfter?HC.crossGap:0);}
function tread(r){return HC.base+r*HC.rise+0.1+(r>=HC.crossAfter?HC.crossStep:0)+(HC.rows[r].lift||0);}
function thEnd(R){return Math.min(Math.asin(Math.min(0.97,HC.side/R)),1.25);}
function add(o){G.add(o);return o;}

function buildHall(key){
  if(G){scene.remove(G);G.traverse(function(o){if(o.geometry&&!o.geometry.userData.shared)o.geometry.dispose();if(o.material&&!o.material.userData.shared)o.material.dispose();});}
  curKey=key;HC=HALLS[key];G=new THREE.Group();scene.add(G);ROWS=HC.rows.length;
  scene.background.setHex(TH.bg);scene.fog.color.setHex(TH.bg);
  var T=HC.blocks[0]+HC.blocks[1]+HC.blocks[2],HW=HC.hallW;

  // seats from the layout masks
  seats=[];byRow=[];aisleArc=[];
  HC.rows.forEach(function(row,r){
    var R=Rof(r),arcs=[],cnt=0;byRow.push([]);
    for(var j=0;j<T;j++){
      var blk=j<HC.blocks[0]?0:(j>=T-HC.blocks[2]?2:1);
      var arc=(j-(T-1)/2)*HC.seatW+(blk===0?-HC.aisle:(blk===2?HC.aisle:0));
      arcs.push(arc);

var yaw=0,pitch=0,oaz=0,oel=0.8,orad=30,tgt=new THREE.Vector3(),fovSeat=74;
function aim(){
  var s=seats[cur],sc=HC.screen,x=s.x,y=tread(s.r)+HC.eye,z=s.z;
  var dx=-x,dy=(HC.screenBottom+sc.h/2)-y,dz=-z;
  yaw=Math.atan2(-dx,-dz);pitch=Math.max(-0.9,Math.min(0.9,Math.atan2(dy,Math.sqrt(dx*dx+dz*dz))*0.8));
}

  if(mode==='seat'){var s=seats[cur];camera.position.set(s.x,tread(s.r)+HC.eye,s.z);camera.rotation.set(pitch,yaw,0);}
  else{var ce=Math.cos(oel);camera.position.set(tgt.x+orad*ce*Math.sin(oaz),tgt.y+orad*Math.sin(oel),tgt.z+orad*ce*Math.cos(oaz));camera.lookAt(tgt);}
}

  var s=seats[cur];

  document.getElementById('info').innerHTML=HC.name+'<br>Seat <b>'+s.lab+'</b> &middot; '+(s.r===0?'front row':s.r+' row'+(s.r>1?'s':'')+' from the screen');
}
function setSeat(i){if(i<0||i>=seats.length)return;cur=i;paint();aim();applyCam();label();
  if(window.parent!==window){try{window.parent.postMessage({type:'seat-view:seat',hall:curKey,seat:seats[i].lab},location.origin);}catch(_){}}}
function step(dr,dc){
  var s=seats[cur];
  if(dc!==0){var j=s.i+dc;if(j>=0&&j<byRow[s.r].length)setSeat(byRow[s.r][j]);return;}
  var r=s.r+dr;
  while(r>=0&&r<ROWS){
    var best=-1,bd=1e9;
    byRow[r].forEach(function(id){var q=seats[id];var d=Math.abs(q.th-s.th)*Rof(r);if(d<bd){bd=d;best=id;}});
    if(best>=0&&bd<2.5){setSeat(best);return;}r+=dr;
  }
}

  var r=Math.floor(ROWS*0.4);while(HC.rows[r].partial)r--;
  var best=byRow[r][0];byRow[r].forEach(function(id){if(Math.abs(seats[id].th)<Math.abs(seats[best].th))best=id;});
  return best;
}

});
el.addEventListener('pointermove',function(e){
  var p=ptrs[e.pointerId];if(!p)return;var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(pc()===2){var d=pdist();zoom(pinch0/d);pinch0=d;return;}
  if(!down)return;moved+=Math.abs(dx)+Math.abs(dy);
  if(mode==='seat'){yaw+=dx*0.005*(camera.fov/74);pitch=Math.max(-1.1,Math.min(1.1,pitch+dy*0.004*(camera.fov/74)));}
  else{oaz-=dx*0.006;oel=Math.max(0.2,Math.min(1.45,oel+dy*0.005));}
  applyCam();
});
var ray=new THREE.Raycaster(),mv=new THREE.Vector2();
function up(e){
  var was=ptrs[e.pointerId];delete ptrs[e.pointerId];
  if(!was)return;
  if(pc()===0&&down&&moved<8&&e.type==='pointerup'){
    var rc=el.getBoundingClientRect();
    mv.set(((e.clientX-rc.left)/rc.width)*2-1,-((e.clientY-rc.top)/rc.height)*2+1);ray.setFromCamera(mv,camera);
    var hit=ray.intersectObjects(pickMeshes);
    if(hit.length&&hit[0].instanceId!==undefined)setSeat(hit[0].instanceId);
  }
  if(pc()===0)down=false;
}
el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
el.addEventListener('wheel',function(e){e.preventDefault();zoom(1+e.deltaY*0.001);},{passive:false});
function resize(){var w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);
if(window.ResizeObserver){new ResizeObserver(resize).observe(stage);}
resize();
// URL options: ?hall=epiq1|epiq2|cosmiq  &seat=H13  &embed=1 (hides the demo bar and header)
(function(){
  var q=new URLSearchParams(location.search),h=q.get('hall'),sl=q.get('seat');
  if(q.get('embed')==='1'){var st=document.createElement('style');st.textContent='.demo,.top{display:none}';document.head.appendChild(st);}
  showHall(HALLS[h]?h:'epiq1');
  function pick(l){for(var i=0;i<seats.length;i++)if(seats[i].lab===String(l).toUpperCase()){setSeat(i);return true;}return false;}
  if(sl)pick(sl);
  window.addEventListener('message',function(e){
    if(e.origin!==location.origin||!e.data)return;
    if(e.data.type==='seat-view:select'){if(e.data.hall&&HALLS[e.data.hall]&&e.data.hall!==curKey)showHall(e.data.hall);pick(e.data.seat);}
  });
})();
(function loop(t){requestAnimationFrame(loop);filmTick(t||0);renderer.render(scene,camera);})();

// ---- maximise / minimise (full screen where the browser allows it, otherwise the view just fills the page) ----
(function(){
  var btn=document.getElementById('fsBtn'),embedded=/[?&]embed=1/.test(location.search)&&window.parent!==window,maxed=false;
  var ICON_MAX='<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
  var ICON_MIN='<svg viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
  var de=document.documentElement,canFS=!!(de.requestFullscreen||de.webkitRequestFullscreen);
  if(!embedded&&!canFS){btn.style.display='none';return;}   // nothing to enlarge
  btn.innerHTML=ICON_MAX;
  function paint(){btn.innerHTML=maxed?ICON_MIN:ICON_MAX;btn.setAttribute('aria-label',maxed?'Exit full screen':'Full screen');btn.title=maxed?'Exit full screen':'Full screen';}
  function setMax(on){
    if(maxed===on)return;maxed=on;paint();
    if(embedded){try{window.parent.postMessage({type:'seat-view:expand',on:on},location.origin);}catch(e){}}
    setTimeout(function(){window.dispatchEvent(new Event('resize'));},80);
  }
  function enterFS(){var rq=de.requestFullscreen||de.webkitRequestFullscreen;if(!rq)return;try{var p=rq.call(de);if(p&&p.catch)p.catch(function(){});}catch(e){}}
  function exitFS(){if(!(document.fullscreenElement||document.webkitFullscreenElement))return;var ex=document.exitFullscreen||document.webkitExitFullscreen;try{var p=ex.call(document);if(p&&p.catch)p.catch(function(){});}catch(e){}}
  btn.addEventListener('click',function(e){e.stopPropagation();if(!maxed){setMax(true);enterFS();}else{setMax(false);exitFS();}});
  btn.addEventListener('pointerdown',function(e){e.stopPropagation();});
  document.addEventListener('fullscreenchange',function(){if(!document.fullscreenElement&&maxed&&!embedded)setMax(false);else if(!document.fullscreenElement&&maxed)setMax(false);});
  document.addEventListener('webkitfullscreenchange',function(){if(!document.webkitFullscreenElement&&maxed)setMax(false);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&maxed){setMax(false);exitFS();}});
})();
})();
</script>
